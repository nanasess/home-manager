name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35

      - name: nix flake check
        run: nix flake check

  emacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: release-snapshot
      - uses: actions/cache@v6
        with:
          path: modules/emacs/elpaca/
          key: elpaca-${{ hashFiles('modules/emacs/init.el') }}
          restore-keys: elpaca-
      - name: Emacs batch load test
        run: emacs --init-directory modules/emacs -l modules/emacs/early-init.el -l modules/emacs/init.el --batch

  # 全ホストを 1 ジョブでビルドする。ホストごとにジョブを分けると、自作 derivation
  # (yaskkserv2 / ibus-skk / mew-bin) や Hydra が作らないもの (unfree の terraform、
  # override した xremap-gnome) を各ジョブが毎回ソースからビルドする。
  # magic-nix-cache は GitHub Actions Cache API に throttle されて run の途中で無効化され、
  # これらを保存できていなかったため、/nix をまるごと 1 つのキャッシュにする
  # cache-nix-action に置き換えた。/nix 全体の tarball はジョブ数ぶん作ると 10GB の枠を
  # 圧迫するので、キャッシュを持つジョブはこの 1 つだけにする。
  #
  # NixOS ホストは toplevel を丸ごとビルドすると linux-t2 カーネルと Apple 復旧イメージ
  # (KVM が要る) を抱えるので、評価と home-manager 側のビルドまでに留める。
  build:
    needs: check
    runs-on: ubuntu-latest
    # リポジトリの GITHUB_TOKEN 既定権限は read のため、cache-nix-action が古いキャッシュを
    # purge (削除) するには actions: write が要る。無いと "Resource not accessible by
    # integration" で削除に失敗し、ジョブは成功のまま main のキャッシュが約 4GB ずつ溜まる。
    # purge 対象は現在の ref のキャッシュだけなので、PR の run が main のキャッシュを消すことはない
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      # cache-nix-action が対応するインストーラ。DeterminateSystems/nix-installer-action は対象外
      - uses: nixbuild/nix-quick-install-action@v35

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          # キーが外れても直近のキャッシュを復元し、差分だけビルドする
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # 保存は main への push のときだけ。1 個約 4GB あり、PR ごとに保存すると 10GB の枠が
          # すぐ埋まる。.nix を変える PR は primary-key が PR 側のキャッシュとも一致しないので、
          # 保存しても効くのは同じ PR への .nix 以外の再 push くらい。PR は main のキャッシュを
          # restore-prefixes-first-match で復元して差分だけビルドする
          save: ${{ github.event_name == 'push' }}
          # 保存時に同じ ref の古いキャッシュを消す (primary-key のものは残す)
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          # 保存前に GC で消せるものをすべて消す。指定しないと、復元した古い世代のパスが
          # 残ったまま新しいビルド結果が足され、flake update のたびにキャッシュが膨らむ
          # (4.0GB → 7.8GB になった)。result* の out-link が GC root なので 4 ホストの
          # 実行時 closure (terraform 等の自前ビルド物を含む) は残り、消えるのは古い世代と
          # ビルド時のみの依存 (Go / Rust ツールチェーン等、cache.nixos.org から取り直せる)
          gc-max-store-size-linux: 0

      - name: Evaluate NixOS toplevel
        run: |
          for host in k-2 wsl-nixos; do
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
          done

      # 1 回の nix build にまとめ、ホスト間で共通の依存を 1 度だけビルドする。
      # --keep-going で 1 ホストが失敗しても他ホストのエラーまで出し切る。result* の
      # out-link は GC root として残す (gc-max-store-size を入れたときに消されないように)
      - name: Build activation packages
        run: |
          nix build --keep-going --print-out-paths \
            '.#homeConfigurations."nanasess@wsl-gentoo".activationPackage' \
            '.#homeConfigurations."nanasess@ubuntu".activationPackage' \
            '.#nixosConfigurations.k-2.config.home-manager.users.nanasess.home.activationPackage' \
            '.#nixosConfigurations.wsl-nixos.config.home-manager.users.nanasess.home.activationPackage'

      - name: Report store and disk usage
        if: always()
        run: |
          du -sh /nix/store
          df -h / /nix
