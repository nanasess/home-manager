name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix flake check
        run: nix flake check

      - name: Lua syntax check
        run: nix shell nixpkgs#lua -c luac -p modules/wezterm/wezterm.lua

  emacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: release-snapshot
      - uses: actions/cache@v6
        with:
          path: modules/emacs/elpaca/
          key: elpaca-${{ hashFiles('modules/emacs/init.el') }}
          restore-keys: elpaca-
      - name: Emacs batch load test
        run: emacs --init-directory modules/emacs -l modules/emacs/early-init.el -l modules/emacs/init.el --batch

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config: nanasess@wsl-gentoo
          - os: ubuntu-latest
            config: nanasess@ubuntu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build activation package
        run: nix build '.#homeConfigurations."${{ matrix.config }}".activationPackage'

  # NixOS ホストは toplevel を丸ごとビルドすると linux-t2 カーネルと Apple 復旧イメージ
  # (KVM が要る) を抱えるので、CI では評価と home-manager 側のビルドまでに留める。
  nixos:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Evaluate NixOS toplevel
        run: nix eval --raw '.#nixosConfigurations.k-2.config.system.build.toplevel.drvPath'

      - name: Build home-manager generation
        run: nix build '.#nixosConfigurations.k-2.config.home-manager.users.nanasess.home.activationPackage'
