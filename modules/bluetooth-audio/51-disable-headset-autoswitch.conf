# Bluetooth ヘッドセット (HFP/HSP) への自動プロファイル切替を無効化する
# (WirePlumber 0.5 以降の .conf 形式。0.4 系向けの同名 .lua と同じ意図)。
#
# 0.5 では 0.4 の bluetooth_policy.policy["media-role.use-headset-profile"] が
# wireplumber.settings の bluetooth.autoswitch-to-headset-profile に置き換わった。
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
